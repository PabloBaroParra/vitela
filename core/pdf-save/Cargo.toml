[package]
name = "pdf-save"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SaveStrategy implementations: incremental-update writer (primary) and full-rewrite writer, encrypted save, deterministic clock/ID hooks. Batch 0 scaffold stub; implementation lands in Batch 6."
publish = false

[dependencies]
pdf-document = { path = "../pdf-document" }
pdf-manip = { path = "../pdf-manip" }
pdf-annotate = { path = "../pdf-annotate" }
pdf-form = { path = "../pdf-form" }
pdf-edit = { path = "../pdf-edit" }
pdf-render = { path = "../pdf-render" }
# Batch 24 (T-195): compression is a step this crate *orders*, not one it
# implements. `pdf-compress` owns the quality tables, the resampling, the
# prune and the never-grow guarantee; this crate owns when that runs and what
# it is allowed to run on (`docs/batch-compress.md` decision 1 and the
# responsibility boundary under it). The dependency points this way and only
# this way — `pdf-compress` knows nothing about saving.
pdf-compress = { path = "../pdf-compress" }
lopdf = "0.45"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
gen-fixtures = { path = "../../tests/fixtures/gen-fixtures" }
