[package]
name = "pdf-sign-pfx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PKCS#12/PFX certificate source adapter for pdf-sign."
publish = false

[dependencies]
p12-keystore = "0.3.1"
pdf-sign = { path = "../pdf-sign" }
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
rsa = { version = "0.9.8", features = ["sha2"] }
sha2 = "0.10.9"
signature = "2.2.0"
thiserror = "2"
x509-cert = { version = "0.2.5", default-features = false, features = ["std"] }

[dev-dependencies]
der = { version = "0.7.10", features = ["alloc", "derive", "oid", "std"] }
rand = "0.10"
spki = { version = "0.7.3", features = ["alloc", "std"] }
