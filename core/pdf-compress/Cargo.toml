[package]
name = "pdf-compress"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "File-size reduction: structural repack, resource prune and image resampling, all under a never-grow guarantee. Batch 24 (T-190..T-197); T-190 ships the guarantee and the preset table, not the optimisation."
publish = false

# `lopdf` arrives with the structural pass (T-191): object streams, the
# cross-reference stream and flate over unfiltered streams are all levers it
# already has (`docs/batch-compress.md` fact 3), so the pass that halves a
# loose document costs no new dependency.
[dependencies]
lopdf = "0.45"
# `image` arrives with the resampler (T-194), for two jobs a PDF library has
# no opinion about: scaling a buffer of samples down, and writing a baseline
# JPEG. The same version and the same two features the rest of the workspace
# already builds (`pdf-edit`, `pdf-save`, `pdf-annotate`), so this adds a
# dependant rather than a dependency. `png` is in the feature list only
# because the workspace shares one `image` build; nothing here reads or
# writes a PNG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# `pdf-edit` for one question too: where does this page paint its images, and
# under what matrix? That inventory already exists there (`docs/batch-compress.md`
# fact 7) — the interpreter that reads it is the same one content editing uses,
# and a second walk written here would be a second walk to keep in step with
# the lexer. T-193 consumes `page_image_placements`; it does not duplicate it.
pdf-edit = { path = "../pdf-edit" }
# `pdf-manip` for one question: does this file carry a signature? Detecting
# one is a question about the object graph, and the repository already has a
# single answer to it (`pdf_manip::document_has_signatures`) that `pdf-save`
# uses from the destination side. A second opinion here is a second opinion
# that can disagree.
pdf-manip = { path = "../pdf-manip" }

# Tests only. T-192's acceptance criterion is "zero visual change, verified by
# comparing renders, not by inspecting the tree" — and for a stage whose job is
# to delete objects, the tree is exactly the witness that cannot see the
# failure. `tests/render_unchanged.rs` rasterises the corpus before and after
# and compares pixels. The crate itself does not depend on a rasteriser: it
# needs one to prove its work, not to do it.
[dev-dependencies]
pdf-render = { path = "../pdf-render" }
