[package]
name = "pdf-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Single-threaded pdfium actor (priority queue, cancel-at-dequeue): render_page, dark-mode inversion, text-run stub, bitmap-handle registry. Batch 3 (T-015..T-021)."
publish = false

[dependencies]
pdfium-render = { version = "0.9.2", default-features = false, features = ["pdfium_7763", "thread_safe"] }

