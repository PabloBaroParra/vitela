[package]
name = "pdf-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Single-threaded pdfium actor (priority queue, cancel-at-dequeue): render_page, dark-mode inversion, text-run stub, bitmap-handle registry. Batch 3 (T-015..T-021)."
publish = false

[dependencies]
# 0.9.3 (not 0.9.2) is required to cross-compile for Android: 0.9.2's custom
# font provider casts a buffer to `*const i8`, hard-coding the assumption that
# `c_char` is signed. It is `u8` on aarch64/x86_64-linux-android, so the crate
# fails to build there; 0.9.3 casts to `c_char` instead. The pinned pdfium
# build is unchanged (`pdfium_7763`), so every vendored and packaged PDFium
# binary stays valid.
pdfium-render = { version = "0.9.3", default-features = false, features = ["pdfium_7763", "thread_safe"] }

[dev-dependencies]
gen-fixtures = { path = "../../tests/fixtures/gen-fixtures" }
png = "0.17"
