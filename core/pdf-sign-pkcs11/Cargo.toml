[package]
name = "pdf-sign-pkcs11"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Linux PKCS#11 certificate source adapter for pdf-sign."
publish = false

[dependencies]
cryptoki = "0.12.0"
pdf-sign = { path = "../pdf-sign" }
thiserror = "2"
# Chain assembly only (issuer/subject walking); stays on the DER 0.7 family
# shared with pdf-sign.
x509-cert = { version = "0.2.5", default-features = false, features = ["std"] }
