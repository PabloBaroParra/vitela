[package]
name = "pdf-form"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AcroForm field builders, edit ops, appearance streams, /DA styling, and existing-AcroForm read interop (Batch 20)."
publish = false

[dependencies]
pdf-document = { path = "../pdf-document" }
