<!doctype html>
<!--
  Cloudflare Pages serves this for any path that is not a file. Without it,
  Pages falls back to index.html for every unknown URL, so a stale
  /assets/<hash>.js would be answered with HTML under the immutable
  Cache-Control from _headers. The web has no client-side routes.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found · Vitela</title>
  </head>
  <body>
    <p>This page does not exist. <a href="/">Open Vitela</a></p>
  </body>
</html>
