[package]
name = "linux-gtk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Linux GTK4 shell (dogfood client) that links core Rust crates directly."
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
# GTK 4.10 provides asynchronous ColorDialog and FileDialog APIs.
gtk = { package = "gtk4", version = "0.9.5", features = ["v4_10"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Rendering comes from pdfium; the document's *permissions* do not — pdfium
# has no view of the lopdf security model. `pdf-manip` supplies both the
# security context and the rule applied to it, so a document that forbids
# copying is refused here exactly as it is at the `pdf-ffi` boundary the
# other shells cross.
pdf-manip = { path = "../../core/pdf-manip" }
pdf-render = { path = "../../core/pdf-render" }
pdf-annotate = { path = "../../core/pdf-annotate" }
pdf-document = { path = "../../core/pdf-document" }
pdf-edit = { path = "../../core/pdf-edit" }
pdf-form = { path = "../../core/pdf-form" }
pdf-save = { path = "../../core/pdf-save" }
pdf-sign = { path = "../../core/pdf-sign" }
pdf-sign-pfx = { path = "../../core/pdf-sign-pfx" }
pdf-sign-pkcs11 = { path = "../../core/pdf-sign-pkcs11" }
sha2 = "0.10.9"
# Content-edit mode (T-161) validates a replacement by cloning the base
# document and probing `pdf-edit`'s real encoder against it — same version
# `pdf-edit` itself depends on.
lopdf = "0.44"

[target.'cfg(target_os = "linux")'.dev-dependencies]
gen-fixtures = { path = "../../tests/fixtures/gen-fixtures" }
