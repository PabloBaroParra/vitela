version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns:
          - "*"
    ignore:
      # The RustCrypto DER family moves as a single unit: cms 0.2 pins
      # der 0.7 / spki 0.7 / x509-cert 0.2 / const-oid 0.9. Bumping any of them
      # without cms splits the graph into two incompatible versions of the same
      # type, and pdf-sign fails to compile with "multiple different versions of
      # crate `der`". cms 0.3 is still pre-release, so the jump waits — and cms
      # is deliberately NOT ignored here, so its stable release still shows up
      # as the signal to migrate the whole family at once. Minor and patch
      # updates within the current series keep coming through.
      - dependency-name: "der"
        update-types: ["version-update:semver-major"]
      - dependency-name: "spki"
        update-types: ["version-update:semver-major"]
      - dependency-name: "x509-cert"
        update-types: ["version-update:semver-major"]
      - dependency-name: "const-oid"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major"]
      - dependency-name: "signature"
        update-types: ["version-update:semver-major"]
      - dependency-name: "digest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "p256"
        update-types: ["version-update:semver-major"]
      # uniffi is pinned EXACTLY (`= 0.31.0`) because the C# bindings are
      # generated by uniffi-bindgen-cs, whose release tags encode the one
      # uniffi-rs version they support — currently v0.11.0+v0.31.0, the newest
      # tag that exists. The generator is installed from a git tag, not from
      # Cargo.toml, so Dependabot cannot see it and cannot know that moving
      # uniffi alone leaves the Windows shell with bindings no generator can
      # produce. Every version is ignored, not just majors: the pin is exact,
      # so even a patch breaks the pair. Lift this when uniffi-bindgen-cs
      # publishes a tag for a newer uniffi, and move both together along with
      # apps/windows/build.ps1 and the version notes in apps/windows/CONTRACT.md.
      - dependency-name: "uniffi"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        # gradle/actions is kept OUT of the group so the `ignore` rule below
        # actually binds. Grouped updates do not honour per-dependency ignores:
        # PR #39 shipped `gradle/actions/setup-gradle` v5.0.2 -> v6.2.0 inside
        # the group even though the rule had been in place since 802cf61, six
        # days earlier. Ungrouped, gradle/actions gets its own PR, where the
        # ignore is applied and the major never reaches one.
        exclude-patterns:
          - "gradle/actions"
    ignore:
      # gradle/actions v6 moved caching into `gradle-actions-caching`, a
      # proprietary component governed by the gradle.com Terms of Use instead
      # of MIT, and setup-gradle loads it whenever caching is enabled. The pin
      # is held at v5 (already node24) on purpose; without this rule Dependabot
      # would re-propose the major every week and quietly undo that decision.
      # Patch and minor updates within v5 still come through.
      - dependency-name: "gradle/actions"
        update-types: ["version-update:semver-major"]
