name: linux

# Builds the release linux-gtk binary and assembles/verifies the .deb and
# .AppImage that scripts/package-linux.sh and scripts/verify-linux-package.sh
# produce locally (T-053). No upload step: this proves the packages assemble,
# contain a genuine Linux/x64/non-V8/non-XFA PDFium, and pass the offline
# smoke render — publishing them is linux-release.yml's job. On a release tag
# release.yml calls this workflow with the tag's Debian version, and only then
# are the verified packages uploaded for linux-release.yml to publish.
#
# linux-gtk-ui.yml stays the separate headless UI-interaction suite (Xvfb,
# gtk::test); this workflow never touches a display — verify-linux-package.sh
# drives the packaged binary through --package-smoke, which renders without
# GTK's event loop (see apps/linux-gtk/src/package_smoke.rs).
on:
  push:
    branches: [main]
    paths:
      - "apps/linux-gtk/**"
      - "core/**"
      - "Cargo.lock"
      - "scripts/package-linux.sh"
      - "scripts/verify-linux-package.sh"
      - "scripts/build-apt-repo.sh"
      - "scripts/release-version.sh"
      - "scripts/release.sh"
      - "scripts/release-notes.sh"
      - "scripts/tests/test-release.sh"
      - "apps/linux-gtk/tests/test-apt-repo.sh"
      - ".github/workflows/linux.yml"
  pull_request:
    paths:
      - "apps/linux-gtk/**"
      - "core/**"
      - "Cargo.lock"
      - "scripts/package-linux.sh"
      - "scripts/verify-linux-package.sh"
      - "scripts/build-apt-repo.sh"
      - "scripts/release-version.sh"
      - "scripts/release.sh"
      - "scripts/release-notes.sh"
      - "scripts/tests/test-release.sh"
      - "apps/linux-gtk/tests/test-apt-repo.sh"
      - ".github/workflows/linux.yml"
  workflow_dispatch:
  # release.yml calls this with the Debian version derived from the release
  # tag; only then are the verified packages uploaded as an artifact. Its
  # rehearsal run (workflow_dispatch, no tag) passes nothing: the packages are
  # built and verified exactly as on a pull request, and nothing is uploaded.
  workflow_call:
    inputs:
      package-version:
        description: Debian package version (e.g. 0.1.0~beta.1); empty for a test-only run
        required: false
        default: ''
        type: string
      app-version:
        description: Version Home's footer shows (release-version.sh <tag> semver); empty shows "dev"
        required: false
        default: ''
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's when release.yml calls this, which keeps a
  # release rehearsal on main from cancelling (or being cancelled by) a push.
  group: linux-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Linux x86_64 .deb/.AppImage package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Only the root lockfile determines this workspace's dependencies.
          # A recursive glob re-runs during cache post-job after sudo smoke
          # verification and can fail traversing root-owned package artifacts.
          key: ${{ runner.os }}-cargo-package-${{ hashFiles('Cargo.lock') }}
      # Same package list scripts/bootstrap-linux-package.sh installs for a
      # local run: libgtk-4-dev for the -sys crates' pkg-config build,
      # dpkg-dev/file/binutils for package-linux.sh's own tool checks, and
      # libfuse2 so linuxdeploy/appimagetool's AppImage runtime can mount
      # itself instead of failing closed with no /dev/fuse.
      - name: Work around a slow/unreachable azure.archive.ubuntu.com mirror
        # GitHub's Azure-hosted Ubuntu runners point apt at a regional mirror
        # (azure.archive.ubuntu.com, listed first in /etc/apt/apt-mirrors.txt)
        # that is sometimes unreachable or very slow. apt falls back to
        # archive.ubuntu.com for the InRelease files but has been observed
        # hanging for 15+ minutes retrying the package indexes against the
        # dead mirror instead of moving on. Dropping the Azure entry leaves
        # only the https://archive.ubuntu.com entries. Rewriting it to
        # http://archive.ubuntu.com instead was tried and also hung: that
        # endpoint stalled ~30s per request before apt fell back to https.
        run: sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
      - name: Install packaging and GTK4 build dependencies
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libgtk-4-dev dpkg-dev file binutils libfuse2
      # The same pinned chromium/7763 Linux/x64 input core.yml's test job
      # downloads for pdf-render's own tests — cached separately because this
      # job feeds it to package-linux.sh as a raw archive, not as an
      # extracted vendor/pdfium tree.
      - name: Cache pinned Linux PDFium packaging input
        id: pdfium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/linux/tools/pdfium-linux-x64.tgz
          key: pdfium-linux-x64-7763-package-input
      - name: Download pinned Linux PDFium packaging input (cache miss)
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/linux/tools
          curl -fsSL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7763/pdfium-linux-x64.tgz" \
            -o build/linux/tools/pdfium-linux-x64.tgz
      - name: Download linuxdeploy and appimagetool
        run: |
          mkdir -p build/linux/tools
          curl -fsSL https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -o build/linux/tools/linuxdeploy
          curl -fsSL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o build/linux/tools/appimagetool
          chmod +x build/linux/tools/linuxdeploy build/linux/tools/appimagetool
      - name: Build linux-gtk (release)
        env:
          # Read by option_env! in app/home/version.rs; empty means a dev build.
          VITELA_VERSION: ${{ inputs.app-version }}
        run: cargo build --release --locked -p linux-gtk
      # package-linux.sh re-verifies the archive's checksum, version and
      # args.gn itself before trusting it (PDFIUM_SHA256_DEFAULT) — this step
      # only hands it the raw inputs.
      - name: Package .deb and .AppImage
        env:
          LINUXDEPLOY: ${{ github.workspace }}/build/linux/tools/linuxdeploy
          APPIMAGETOOL: ${{ github.workspace }}/build/linux/tools/appimagetool
          PDFIUM_ARCHIVE: ${{ github.workspace }}/build/linux/tools/pdfium-linux-x64.tgz
          # Empty outside workflow_call; the scripts then fall back to Cargo.toml.
          PACKAGE_VERSION: ${{ inputs.package-version }}
        run: bash scripts/package-linux.sh
      # verify-linux-package.sh runs the packaged binary under a bare
      # `unshare --net` of its own (no --user/--map-root-user, see its own
      # comments and core.yml's zero-network job) to prove the smoke render
      # makes no network attempt, which needs the whole script to already
      # hold the privilege that syscall requires — hence the outer sudo,
      # same reasoning as core.yml's zero-network-enforcement job.
      - name: Verify packaged .deb and .AppImage (offline smoke)
        env:
          PACKAGE_VERSION: ${{ inputs.package-version }}
        run: sudo -E env "PATH=$PATH" bash scripts/verify-linux-package.sh "$GITHUB_WORKSPACE/build/linux/packages"
      - name: Upload verified packages for the release
        if: inputs.package-version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: |
            build/linux/packages/*.deb
            build/linux/packages/*.AppImage
          if-no-files-found: error

  # The release tooling release.yml and linux-release.yml run: the tag grammar/version
  # formats and release.sh (scripts/tests/test-release.sh), and the signed APT
  # repository build, exercised end to end against a real unprivileged
  # `apt-get update` (see each test's own header).
  release-tooling:
    name: Release tooling and signed APT repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Work around a slow/unreachable azure.archive.ubuntu.com mirror
        run: sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
      - name: Install apt-ftparchive
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y apt-utils
      - name: Release tooling shell tests
        run: bash scripts/tests/test-release.sh
      - name: APT repository shell tests
        run: bash apps/linux-gtk/tests/test-apt-repo.sh
