name: release

# The one entry point of a Vitela release. `scripts/release.sh 0.2.0-beta.1`
# tags origin/main and pushes the tag; this workflow then:
#
#   1. refuses a tag that is not on main, and translates it into every
#      platform's version format (scripts/release-version.sh),
#   2. runs EVERY platform's test suite on the tagged commit, in parallel —
#      the same workflows that gate pull requests, called rather than copied,
#   3. publishes only if all of them passed: the signed APT repository and
#      GitHub Release (linux-release.yml), the Microsoft Store
#      (windows-store.yml) and Google Play (android-release.yml).
#
# The publish workflows have no trigger of their own, so there is no path from
# a tag to users that skips step 2. Each publish target is independent: if one
# fails after the gate, the others still ship, and its job can be re-run.
#
# Linux and Android are tested and packaged in one call each: linux.yml and
# android.yml build and verify the .deb/.AppImage and the .aab with the tag's
# version and upload exactly those files, which linux-release.yml publishes and
# android-release.yml signs and uploads. Nothing is rebuilt between test and
# release.
#
# workflow_dispatch is a rehearsal: the whole test gate on any ref, with no
# version and nothing published. Use it before cutting a release.
#
# Setup for each publish target is listed in its own workflow's header.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve the release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      debian: ${{ steps.map.outputs.debian }}
      msix: ${{ steps.map.outputs.msix }}
      semver: ${{ steps.map.outputs.semver }}
      android-code: ${{ steps.map.outputs.android-code }}
      play-track: ${{ steps.map.outputs.play-track }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # scripts/release.sh only ever tags origin/main; a tag pushed by hand
      # onto a branch commit is refused here, before any test minute is spent.
      - name: Require the tag to be on main
        if: github.ref_type == 'tag'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "$GITHUB_REF_NAME does not point at a commit on main" >&2; exit 1; }
      # Assigned first, then printed: a failing $(...) inside printf's
      # arguments would not stop the step.
      - name: Translate the tag into each platform's version
        id: map
        if: github.ref_type == 'tag'
        run: |
          debian="$(bash scripts/release-version.sh "$GITHUB_REF_NAME" debian)"
          msix="$(bash scripts/release-version.sh "$GITHUB_REF_NAME" msix)"
          semver="$(bash scripts/release-version.sh "$GITHUB_REF_NAME" semver)"
          android_code="$(bash scripts/release-version.sh "$GITHUB_REF_NAME" android-code)"
          play_track="$(bash scripts/release-version.sh "$GITHUB_REF_NAME" play-track)"
          {
            printf 'debian=%s\nmsix=%s\nsemver=%s\n' "$debian" "$msix" "$semver"
            printf 'android-code=%s\nplay-track=%s\n' "$android_code" "$play_track"
          } >> "$GITHUB_OUTPUT"
          printf '%s -> debian %s, msix %s, android %s (%s) on %s\n' \
            "$GITHUB_REF_NAME" "$debian" "$msix" "$semver" "$android_code" "$play_track"

  # --- The gate: every suite that protects main, on the tagged commit. ------

  core:
    name: Core
    needs: version
    uses: ./.github/workflows/core.yml

  security:
    name: Security
    needs: version
    uses: ./.github/workflows/security.yml

  maintainability:
    name: Maintainability
    needs: version
    uses: ./.github/workflows/maintainability.yml

  docs:
    name: Docs
    needs: version
    uses: ./.github/workflows/docs.yml

  linux:
    name: Linux
    needs: version
    uses: ./.github/workflows/linux.yml
    with:
      # Empty on a rehearsal: built and verified, but not uploaded.
      package-version: ${{ needs.version.outputs.debian }}
      app-version: ${{ needs.version.outputs.semver }}

  linux-gtk-ui:
    name: Linux UI
    needs: version
    uses: ./.github/workflows/linux-gtk-ui.yml

  windows:
    name: Windows
    needs: version
    uses: ./.github/workflows/windows.yml
    # The package job signs with the release certificate when it exists.
    secrets: inherit

  android:
    name: Android
    needs: version
    uses: ./.github/workflows/android.yml
    with:
      # Empty on a rehearsal: the bundle is built and checked, not uploaded.
      version-code: ${{ needs.version.outputs.android-code }}
      version-name: ${{ needs.version.outputs.semver }}

  macos:
    name: macOS
    needs: version
    uses: ./.github/workflows/macos.yml

  ios:
    name: iOS
    needs: version
    uses: ./.github/workflows/ios.yml

  # --- Publish: only on a tag, only after the whole gate passed. -----------

  publish-linux:
    name: Publish Linux (GitHub Release + APT)
    if: github.ref_type == 'tag'
    needs: [version, core, security, maintainability, docs, linux, linux-gtk-ui, windows, android, macos, ios]
    uses: ./.github/workflows/linux-release.yml
    with:
      debian-version: ${{ needs.version.outputs.debian }}
    secrets: inherit
    permissions:
      contents: write
      pages: write
      id-token: write

  publish-windows:
    name: Publish Windows (Microsoft Store)
    if: github.ref_type == 'tag'
    needs: [version, core, security, maintainability, docs, linux, linux-gtk-ui, windows, android, macos, ios]
    uses: ./.github/workflows/windows-store.yml
    with:
      msix-version: ${{ needs.version.outputs.msix }}
      app-version: ${{ needs.version.outputs.semver }}
    secrets: inherit

  publish-android:
    name: Publish Android (Google Play)
    if: github.ref_type == 'tag'
    needs: [version, core, security, maintainability, docs, linux, linux-gtk-ui, windows, android, macos, ios]
    uses: ./.github/workflows/android-release.yml
    with:
      play-track: ${{ needs.version.outputs.play-track }}
    secrets: inherit
