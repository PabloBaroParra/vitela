name: Linux GTK UI

on:
  # release.yml runs this suite on the tagged commit before publishing anything.
  workflow_call:
  pull_request:
    paths:
      - 'apps/linux-gtk/**'
      - '.github/workflows/linux-gtk-ui.yml'
      - 'CONTRIBUTING.md'
  push:
    branches: [main]
    paths:
      - 'apps/linux-gtk/**'
      - '.github/workflows/linux-gtk-ui.yml'
      - 'CONTRIBUTING.md'

permissions:
  contents: read

jobs:
  gtk-ui-tests:
    name: GTK UI tests (Linux/X11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      # Tests that open a real document (e.g. the password prompt an
      # encrypted sample raises) need the prebuilt pdfium dynamic library,
      # which is never committed. Same pinned release and resolution as the
      # workspace test job in core.yml.
      - name: Cache pdfium prebuilt
        id: pdfium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/pdf-render/vendor/pdfium
          key: pdfium-linux-x64-7763
      - name: Download pdfium prebuilt (cache miss)
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7763/pdfium-linux-x64.tgz" \
            | tar -xz -C core/pdf-render/vendor/pdfium
      - name: Point PDFIUM_DYNAMIC_LIB_PATH at the extracted library
        run: |
          lib="$(find core/pdf-render/vendor/pdfium -name 'libpdfium.so' | head -n1)"
          test -n "$lib" || { echo "libpdfium.so not found after extraction"; exit 1; }
          echo "PDFIUM_DYNAMIC_LIB_PATH=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
      - name: Work around a slow/unreachable azure.archive.ubuntu.com mirror
        # GitHub's Azure-hosted Ubuntu runners point apt at a regional mirror
        # (azure.archive.ubuntu.com, listed first in /etc/apt/apt-mirrors.txt)
        # that is sometimes unreachable or very slow. apt falls back to
        # archive.ubuntu.com for the InRelease files but has been observed
        # hanging for 15+ minutes retrying the package indexes against the
        # dead mirror instead of moving on. Dropping the Azure entry leaves
        # only the https://archive.ubuntu.com entries. Rewriting it to
        # http://archive.ubuntu.com instead was tried and also hung: that
        # endpoint stalled ~30s per request before apt fell back to https.
        run: sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
      - name: Install GTK4 and Xvfb
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libgtk-4-dev pkg-config xvfb
      - name: Run focused GTK tests under Xvfb
        run: >-
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24'
          env GDK_BACKEND=x11 cargo test -p linux-gtk --locked gtk_ui_
