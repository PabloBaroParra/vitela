name: macos

# Builds and verifies an ad-hoc signed Vitela.app. On a pull request that is
# all it does. When release.yml calls it with a version, the bundle is built
# universal (arm64 + x86_64) with that version and uploaded as an artifact,
# which release.yml attaches to the GitHub Release as an unsigned download:
# not notarized, so macOS asks the reader to allow it once
# (docs/macos-distribution.md, "Without a paid account"). Developer ID and
# Mac App Store builds need the maintainer's Apple credentials and are made
# with scripts/package-macos.sh.
#
# Path-filtered on purpose — see the same note in ios.yml. macOS runners bill at
# 10x on a private repo. Use workflow_dispatch to force a run.
on:
  # release.yml runs this suite on the tagged commit before publishing anything.
  # Its rehearsal (no tag) passes no version: built and tested, not uploaded.
  workflow_call:
    inputs:
      app-version:
        description: Release semver (release-version.sh <tag> semver); empty for a test-only run
        required: false
        default: ''
        type: string
      build-number:
        description: CFBundleVersion, growing with every release (the Android version code)
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    # Duplicated rather than shared with a YAML anchor: the Actions workflow
    # parser does not support anchors or aliases.
    paths:
      - "apps/macos/**"
      - "apps/apple/**"
      - "core/**"
      - "Cargo.lock"
      - "scripts/build-macos.sh"
      - "scripts/package-macos.sh"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "apps/macos/**"
      - "apps/apple/**"
      - "core/**"
      - "Cargo.lock"
      - "scripts/build-macos.sh"
      - "scripts/package-macos.sh"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's when release.yml calls this, which keeps a
  # release rehearsal on main from cancelling (or being cancelled by) a push.
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-development-artifact:
    name: macOS 12 development artifact
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          # x86_64 only matters for a release's universal bundle; adding it
          # always keeps the cache key and the toolchain step identical.
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache pinned macOS PDFium
        id: pdfium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/pdf-render/vendor/pdfium
          key: pdfium-mac-univ-7763
      - name: Download pinned macOS PDFium (cache miss)
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7763/pdfium-mac-univ.tgz" \
            | tar -xz -C core/pdf-render/vendor/pdfium
      - name: Resolve bundled PDFium
        run: |
          lib="$(find core/pdf-render/vendor/pdfium -name 'libpdfium.dylib' | head -n1)"
          test -n "$lib" || { echo "libpdfium.dylib not found after extraction"; exit 1; }
          echo "PDFIUM_DYNAMIC_LIB_PATH=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
          echo "PDFIUM_DYLIB=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
      - name: Format, lint, and compile the FFI contract
        run: |
          cargo fmt --all -- --check
          cargo clippy -p pdf-ffi --all-targets --locked -- -D warnings
          cargo test -p pdf-ffi --locked --no-run
      - name: Run portable deployment and bundle tests
        run: |
          bash apps/macos/Tests/test-build-macos.sh
          bash apps/macos/Tests/test-bundle-integrity.sh
          bash apps/macos/Tests/test-package-macos.sh
      # Also regenerates the Swift bindings and asserts all three generated
      # artifacts exist — the app cannot link without the header and modulemap,
      # not just pdf_ffi.swift.
      - name: Assemble development bundle
        env:
          VITELA_VERSION: ${{ inputs.app-version }}
          VITELA_BUILD_NUMBER: ${{ inputs.build-number }}
          VITELA_UNIVERSAL: ${{ inputs.app-version != '' && '1' || '' }}
        run: bash scripts/build-macos.sh --assemble
      - name: Run Swift unit and interaction tests
        run: xcodebuild -project apps/macos/Vitela.xcodeproj -scheme Vitela -destination 'platform=macOS' test
      - name: Fail closed on actual Mach-O deployment and bundle linkage
        run: bash scripts/build-macos.sh --verify-bundle "$GITHUB_WORKSPACE/build/Vitela.app"
      # ditto, as Apple recommends for app bundles: it keeps the symlinks and
      # metadata the code signature covers, which a plain zip may not.
      - name: Package the unsigned download
        if: inputs.app-version != ''
        env:
          APP_VERSION: ${{ inputs.app-version }}
        run: |
          for binary in build/Vitela.app/Contents/MacOS/Vitela build/Vitela.app/Contents/Frameworks/*.dylib; do
            lipo "$binary" -verify_arch arm64 x86_64 || { echo "$binary is not universal" >&2; exit 1; }
          done
          codesign --verify --deep --strict build/Vitela.app
          mkdir -p build/macos-release
          ditto -c -k --keepParent build/Vitela.app "build/macos-release/Vitela-$APP_VERSION-macos-unsigned.zip"
      - name: Upload the unsigned download for the release
        if: inputs.app-version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-app
          path: build/macos-release/*.zip
          if-no-files-found: error
