name: macos

# Batch 7 (T-042): proves the UniFFI Swift bindings generate cleanly from
# the compiled pdf-ffi cdylib on a real macOS runner. Batch 9 extends this
# workflow with the SwiftUI shell build, .dylib bundling and sign/notarize
# (design.md "CI Sketch"); Batch 14 extends it again for the iOS target
# (T-102) — no separate ios.yml.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  swift-bindings:
    name: UniFFI Swift bindings generation (T-042)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build pdf-ffi cdylib
        run: cargo build -p pdf-ffi --locked
      # Library mode: uniffi introspects the compiled cdylib's embedded
      # metadata (emitted by `uniffi::setup_scaffolding!()`), so the bindings
      # can never drift from the Rust surface actually built. The bindgen CLI
      # lives behind pdf-ffi's `bindgen` feature — see
      # core/pdf-ffi/src/bin/uniffi-bindgen.rs.
      - name: Generate Swift bindings (library mode)
        run: |
          cargo run -p pdf-ffi --features bindgen --locked --bin uniffi-bindgen -- \
            generate --library target/debug/libpdf_ffi.dylib \
            --language swift --out-dir target/bindings/swift
      - name: Assert expected Swift binding artifacts exist
        run: |
          set -euo pipefail
          for f in pdf_ffi.swift pdf_ffiFFI.h pdf_ffiFFI.modulemap; do
            test -f "target/bindings/swift/$f" \
              || { echo "missing generated binding artifact: $f"; ls -la target/bindings/swift; exit 1; }
          done
