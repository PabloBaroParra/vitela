name: macos

# Builds and verifies an ad-hoc signed, development-only Vitela.app — not
# notarized, not distributable, and deliberately NOT published: the job proves
# the shell assembles and clears the deployment gate, nothing more. Uploading
# an artifact waits for T-059's distribution signing and notarization.
#
# Path-filtered on purpose — see the same note in ios.yml. macOS runners bill at
# 10x on a private repo. Use workflow_dispatch to force a run.
on:
  push:
    branches: [main]
    # Duplicated rather than shared with a YAML anchor: the Actions workflow
    # parser does not support anchors or aliases.
    paths:
      - "apps/macos/**"
      - "apps/apple/**"
      - "core/**"
      - "Cargo.lock"
      - "scripts/build-macos.sh"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "apps/macos/**"
      - "apps/apple/**"
      - "core/**"
      - "Cargo.lock"
      - "scripts/build-macos.sh"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-development-artifact:
    name: macOS 12 development artifact
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache pinned macOS PDFium
        id: pdfium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/pdf-render/vendor/pdfium
          key: pdfium-mac-univ-7763
      - name: Download pinned macOS PDFium (cache miss)
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7763/pdfium-mac-univ.tgz" \
            | tar -xz -C core/pdf-render/vendor/pdfium
      - name: Resolve bundled PDFium
        run: |
          lib="$(find core/pdf-render/vendor/pdfium -name 'libpdfium.dylib' | head -n1)"
          test -n "$lib" || { echo "libpdfium.dylib not found after extraction"; exit 1; }
          echo "PDFIUM_DYNAMIC_LIB_PATH=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
          echo "PDFIUM_DYLIB=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
      - name: Format, lint, and compile the FFI contract
        run: |
          cargo fmt --all -- --check
          cargo clippy -p pdf-ffi --all-targets --locked -- -D warnings
          cargo test -p pdf-ffi --locked --no-run
      - name: Run portable deployment and bundle tests
        run: |
          bash apps/macos/Tests/test-build-macos.sh
          bash apps/macos/Tests/test-bundle-integrity.sh
      # Also regenerates the Swift bindings and asserts all three generated
      # artifacts exist — the app cannot link without the header and modulemap,
      # not just pdf_ffi.swift.
      - name: Assemble development bundle
        run: bash scripts/build-macos.sh --assemble
      - name: Run Swift unit and interaction tests
        run: xcodebuild -project apps/macos/Vitela.xcodeproj -scheme Vitela -destination 'platform=macOS' test
      - name: Fail closed on actual Mach-O deployment and bundle linkage
        run: bash scripts/build-macos.sh --verify-bundle "$GITHUB_WORKSPACE/build/Vitela.app"
      # No upload step on purpose. The bundle is built and fully verified here,
      # but nothing is published yet: publishing is what T-059 gates behind
      # distribution signing and notarization. Restoring it is one
      # actions/upload-artifact step against build/Vitela.app.
