name: docs

# Guards the README status tables against silent drift: every crate named in
# the "Tools & features" table must exist, and both tables must use only the
# documented status symbols. See scripts/check_readme_tables.py for what this
# does and does not verify.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  readme-tables:
    name: README status tables are consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate README status tables
        run: python3 scripts/check_readme_tables.py
