name: core

# Runs on every PR/push touching the Rust workspace. Platform-specific
# workflows (linux.yml, macos.yml, windows.yml) build/package the shells and
# land in later batches (Batch 8/9/10) — see design.md "CI Sketch".
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Each job only reads repository contents. Workflows requiring additional
# privileges declare them at job scope instead of inheriting a broad token.
permissions:
  contents: read

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      # apps/linux-gtk's gtk4 dependency is active on Linux runners and its
      # -sys crates resolve GTK through pkg-config at build time.
      - name: Install GTK4 development libraries (apps/linux-gtk)
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - name: Clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: cargo test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      # pdf-render/pdf-save/pdf-ffi integration tests need the prebuilt
      # pdfium dynamic library, which is never committed (see
      # core/pdf-render/vendor/pdfium/README.md). Same pinned release the
      # enabled pdfium_7763 Cargo feature targets. The Linux tarball ships
      # the library under lib/ (not bin/), so resolution goes through the
      # PDFIUM_DYNAMIC_LIB_PATH env override rather than the vendored-dir
      # convention (see core/pdf-render/src/library.rs).
      - name: Cache pdfium prebuilt
        id: pdfium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/pdf-render/vendor/pdfium
          key: pdfium-linux-x64-7763
      - name: Download pdfium prebuilt (cache miss)
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7763/pdfium-linux-x64.tgz" \
            | tar -xz -C core/pdf-render/vendor/pdfium
      - name: Point PDFIUM_DYNAMIC_LIB_PATH at the extracted library
        run: |
          lib="$(find core/pdf-render/vendor/pdfium -name 'libpdfium.so' | head -n1)"
          test -n "$lib" || { echo "libpdfium.so not found after extraction"; exit 1; }
          echo "PDFIUM_DYNAMIC_LIB_PATH=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
      # apps/linux-gtk's gtk4 dependency is active on Linux runners and its
      # -sys crates resolve GTK through pkg-config at build time.
      - name: Install GTK4 development libraries (apps/linux-gtk)
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - name: Build workspace
        run: cargo build --workspace --locked
      # apps/linux-gtk's #[gtk::test]s need a real display (gtk_init_check
      # fails and panics without one). This runner has no Xvfb, so they run
      # separately under linux-gtk-ui.yml instead. They are identified by the
      # `gtk_ui_` name prefix rather than by module, because they live beside
      # the code they cover (CLAUDE.md) and so are spread across several
      # modules — the prefix is the contract both workflows filter on, and a
      # #[gtk::test] added without it will fail here rather than be skipped.
      - name: Run tests (workspace)
        run: cargo test --workspace --locked -- --skip gtk_ui_

  zero-network:
    name: zero-network enforcement (T-005)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache pdfium prebuilt
        id: pdfium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/pdf-render/vendor/pdfium
          key: pdfium-linux-x64-7763
      - name: Download pdfium prebuilt (cache miss)
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7763/pdfium-linux-x64.tgz" \
            | tar -xz -C core/pdf-render/vendor/pdfium
      - name: Point PDFIUM_DYNAMIC_LIB_PATH at the extracted library
        run: |
          lib="$(find core/pdf-render/vendor/pdfium -name 'libpdfium.so' | head -n1)"
          test -n "$lib" || { echo "libpdfium.so not found after extraction"; exit 1; }
          echo "PDFIUM_DYNAMIC_LIB_PATH=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"
      # apps/linux-gtk's gtk4 dependency is active on Linux runners and its
      # -sys crates resolve GTK through pkg-config at build time.
      - name: Install GTK4 development libraries (apps/linux-gtk)
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      # Build/fetch everything BEFORE entering the network namespace: cargo
      # itself needs network access to resolve/download crates, but the test
      # *run* must not. Compiling test binaries ahead of time means the
      # isolated steps below only need to execute already-built artifacts.
      - name: Pre-build test binaries (network allowed)
        run: cargo test --workspace --locked --no-run
      # `unshare --net` creates a new network namespace with only a loopback
      # interface and no configured route — any outbound connection attempt
      # fails immediately (ENETUNREACH), regardless of the runner's actual
      # network policy. This is real enforcement, not a hope-based check;
      # see spec.md "Offline-First, No Telemetry" and
      # tools/zero-network-guard's `real_world_egress.rs` for the assertion
      # that proves the isolation is actually in effect.
      #
      # The namespace's loopback starts DOWN, which makes even 127.0.0.1
      # unreachable — `ip link set lo up` restores it so loopback-only tests
      # (zero-network-guard's `detects_reachable_local_listener_as_a_leak`)
      # behave as on any real machine. External egress stays impossible
      # either way: the namespace has no other interface and no route out.
      #
      # `sudo` resets PATH via secure_path and drops the runner env, so
      # `env "PATH=$PATH"` re-injects the toolchain PATH and -E preserves
      # HOME/PDFIUM_DYNAMIC_LIB_PATH for rustup/cargo/pdfium resolution.
      # Do not add `--map-root-user` here: `sudo` already supplies the
      # privilege needed for `--net`, while an extra user namespace prevents
      # the mapped root process from executing the runner-owned Cargo binary.
      #
      # The full (non-ignored) suite runs inside the namespace — that IS the
      # T-005 enforcement: every test must pass with no usable network. The
      # egress proof then runs scoped to zero-network-guard; the perf harness
      # (also #[ignore]d) is deliberately NOT run in CI — wall-clock
      # assertions on shared runners are noise, per its own module docs.
      # Same app::ui_tests exclusion as the `test` job above: those
      # #[gtk::test]s need a real display, which this runner doesn't have.
      - name: Run the full test suite inside a network namespace
        run: |
          sudo -E env "PATH=$PATH" unshare --net \
            sh -c 'ip link set lo up && exec cargo test --workspace --locked -- --skip gtk_ui_'
      - name: Run zero-network-guard's CI-only egress proof inside the namespace
        run: |
          sudo -E env "PATH=$PATH" unshare --net \
            sh -c 'ip link set lo up && exec cargo test -p zero-network-guard --locked -- --ignored'

  determinism:
    name: pdf-save deterministic-writer byte-identical check (T-038)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      # `pdf-save`'s full-rewrite writer takes its clock and trailer-/ID
      # generator as injectable dependencies (T-036) so this test can inject
      # `FixedClock`/`SequentialIdGenerator` and assert the writer produces
      # byte-identical output across two independent save calls given the
      # same input + edit sequence — a structural-equivalence check, not a
      # claim that two different real-time saves are identical. See
      # design.md "Deterministic writer hooks".
      - name: Run the byte-identical determinism test (pdf-save)
        run: |
          cargo test -p pdf-save --locked --lib \
            full_rewrite_with_fixed_options_is_byte_identical_across_runs -- --exact

  content-roundtrip-validation:
    name: content round-trip validation (T-160)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v3.13.0
        with:
          python-version: "3.13"
      - name: Install pinned pypdf before network isolation
        run: python3 -m pip install --require-hashes -r tools/pypdf-validation/requirements.txt
      - name: Produce and validate content round trip offline
        run: |
          output="$RUNNER_TEMP/t160 content;roundtrip.pdf"
          trap 'rm -f "$output"' EXIT
          PDF_SAVE_VALIDATION_OUTPUT="$output" \
            cargo test -p pdf-save --locked --test content_edit_roundtrip \
            write_pypdf_validation_output -- --ignored --exact
          sudo -E env "PATH=$PATH" unshare --net \
            sh -c 'ip link set lo up && exec python3 tools/pypdf-validation/validate_content_roundtrip.py "$1"' \
            sh "$output"
