name: ios

# Experimental. This builds the iOS shell and runs its unit tests on a
# simulator, then fails closed on the deployment floor the produced binaries
# actually declare. What it still does NOT establish: behaviour on a physical
# iPhone, signing, provisioning, or distribution — all of which need a paid
# Apple Developer account and none of which are covered here. See README
# "Platform status".
#
# Path-filtered on purpose. A macOS runner bills at 10x on a private repo, so an
# unfiltered iOS job charged ~100 minutes for every push — including pushes that
# only touched the README. Use workflow_dispatch to force a run.
on:
  push:
    branches: [main]
    # Duplicated rather than shared with a YAML anchor: the Actions workflow
    # parser does not support anchors or aliases.
    paths:
      - "apps/ios/**"
      - "apps/apple/**"
      - "core/**"
      - "Cargo.lock"
      - "scripts/build-ios.sh"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - "apps/apple/**"
      - "core/**"
      - "Cargo.lock"
      - "scripts/build-ios.sh"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  IOS_DEPLOYMENT_FLOOR: "15.0"
  PDFIUM_RELEASE: "7763"

permissions:
  contents: read

# Superseded runs are cancelled rather than left to finish: at 10x, a queue of
# stale iOS runs is the single most expensive thing in this repo.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: iOS 15 simulator build and tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the portable deployment-floor tests
        run: bash apps/ios/Tests/test-build-ios.sh
      - name: Validate the approved iOS floor
        run: bash scripts/build-ios.sh --validate-deployment-floor

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim,aarch64-apple-ios
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ios-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache pinned iOS simulator PDFium
        id: pdfium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/pdf-render/vendor/pdfium-iphonesimulator
          key: pdfium-ios-simulator-arm64-${{ env.PDFIUM_RELEASE }}
      - name: Download pinned iOS simulator PDFium (cache miss)
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p core/pdf-render/vendor/pdfium-iphonesimulator
          curl -sL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/${PDFIUM_RELEASE}/pdfium-ios-simulator-arm64.tgz" \
            | tar -xz -C core/pdf-render/vendor/pdfium-iphonesimulator
      - name: Resolve bundled PDFium
        run: |
          lib="$(find core/pdf-render/vendor/pdfium-iphonesimulator -name 'libpdfium.dylib' | head -n1)"
          test -n "$lib" || { echo "libpdfium.dylib not found after extraction"; exit 1; }
          echo "PDFIUM_DYLIB=$GITHUB_WORKSPACE/$lib" >> "$GITHUB_ENV"

      - name: Build the FFI for the simulator and regenerate Swift bindings
        run: bash scripts/build-ios.sh --prepare iphonesimulator

      # Selecting by UDID rather than by device name: the set of preinstalled
      # simulators changes with every runner image, and a hardcoded name is the
      # usual reason an Apple CI job starts failing without a code change.
      - name: Select an available iPhone simulator
        run: |
          udid="$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next((x['udid'] for r,ds in d.items() if 'iOS' in r for x in ds if 'iPhone' in x['name']), ''))")"
          test -n "$udid" || { echo "no available iPhone simulator on this runner"; exit 1; }
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Run Swift unit tests on the simulator
        run: |
          xcodebuild -project apps/ios/VitelaIOS.xcodeproj -scheme VitelaIOS \
            -destination "id=$SIMULATOR_UDID" test

      # The floor is a promise about iPhones, so it is checked against the
      # device slice — the only one that ever ships. The simulator slice is
      # proven by the test run above, which cannot pass unless it loads.
      - name: Cache pinned iOS device PDFium
        id: pdfium-device-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/pdf-render/vendor/pdfium-iphoneos
          key: pdfium-ios-device-arm64-${{ env.PDFIUM_RELEASE }}
      - name: Download pinned iOS device PDFium (cache miss)
        if: steps.pdfium-device-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p core/pdf-render/vendor/pdfium-iphoneos
          curl -sL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/${PDFIUM_RELEASE}/pdfium-ios-device-arm64.tgz" \
            | tar -xz -C core/pdf-render/vendor/pdfium-iphoneos

      - name: Build the FFI for the device slice
        env:
          PDFIUM_DYLIB: ""
        run: bash scripts/build-ios.sh --prepare iphoneos
      - name: Fail closed on the deployment floor the device binaries declare
        env:
          PDFIUM_DYLIB: ""
        run: bash scripts/build-ios.sh --verify-deployment iphoneos

      # No upload step, on purpose: a simulator build is not installable on a
      # device, and a device build would need signing this repo cannot do.
