[workspace]
resolver = "2"
members = [
    "core/pdf-document",
    "core/pdf-render",
    "core/pdf-manip",
    "core/pdf-annotate",
    "core/pdf-form",
    "core/pdf-edit",
    "core/pdf-compress",
    "core/pdf-save",
    "core/pdf-ffi",
    "core/pdf-wasm",
    "core/pdf-sign",
    "core/pdf-sign-pkcs11",
    "core/pdf-sign-pfx",
    "core/pdf-sign-nss",
    "apps/linux-gtk",
    "tests/fixtures/gen-fixtures",
    "tools/gen-sample",
    "tools/zero-network-guard",
]
# spikes/uniffi-cs is a standalone crate/workspace (Batch 1 spike) — deliberately
# excluded so its experimental uniffi-bindgen-cs dependency pin can never break
# the main workspace build/lockfile. spikes/web-wasm (Batch 26 phase-0 web
# spike) is excluded for the same reason.
exclude = ["spikes/uniffi-cs", "spikes/web-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

# The web engine (core/pdf-wasm) as apps/web ships it: LTO + one codegen unit
# cut the phase-0 spike's module from 2.3 MB to 1.5 MB raw. A profile of its
# own because `lto` cannot be set per package, and the native release builds
# keep their link times.
[profile.wasm-release]
inherits = "release"
lto = true
codegen-units = 1

[patch.crates-io]
p12-keystore = { path = "vendor/p12-keystore" }
lopdf = { path = "vendor/lopdf-0.45.0" }
